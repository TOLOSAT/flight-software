name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_WARNING: no

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
        token: ${{ secrets.SUBMODULES_TOKEN }}

    - name: Set Up Environment
      run: |
        sudo apt update
        sudo apt install -y make cppcheck doxygen graphviz python2-minimal

    - name: Load Default Configuration
      run: make default_defconfig

    - name: Check Doxygen-Comments
      run: ./tools/update-doc.sh

    - name: Save Doxygen log as artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: doxygen-log
        path: build/doxygen/doxygen.log

    - name: Save Doxygen Output as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: doxygen-output
        path: build/doxygen

  docs-deploy:
    if: github.event_name == 'push'
    name: Documentation Deploy
    runs-on: ubuntu-latest
    needs: docs-check

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Doxygen Output Artifact
      uses: actions/download-artifact@v4
      with:
        name: doxygen-output
        path: build/doxygen

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'build/doxygen/html'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
