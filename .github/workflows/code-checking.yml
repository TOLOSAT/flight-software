name: Code Checking

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-checking:
    name: Run static code verification
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Set Up Environment
      run: |
        sudo apt update
        sudo apt install -y make cppcheck

    - name: Load Default Configuration
      run: make default_defconfig

    - name: Run Code-Checking
      run: make verif

    - name: Save Code-Checking log as artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: code-checking-log
        path: build/code-checking.log
