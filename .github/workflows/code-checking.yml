name: Code & Documentation Checking

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-checking:
    name: Run Code-Checking and Check Doxygen-Comments
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set Up Environment
      run: |
        sudo apt update
        sudo apt install -y make cppcheck doxygen

    - name: Run Code-Checking
      run: make verif

    - name: Save Code-Checking log as artifact
      if: failure() && matrix.job != 'check-doxygen-comments'
      uses: actions/upload-artifact@v4
      with:
        name: code-checking-log
        path: build/code-checking.log

    - name: Check Doxygen-Comments
      run: ./update-doc.sh

    - name: Save Doxygen log as artifact
      if: failure() && matrix.job != 'run-code-checking'
      uses: actions/upload-artifact@v4
      with:
        name: doxygen-log
        path: build/doxygen/doxygen.log